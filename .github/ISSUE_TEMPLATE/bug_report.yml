name: Bug report
description: Something is wrong with an export or the extension
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste confidential board content.** A small redacted example is enough.
        For security problems, use a private [security advisory](https://github.com/ITBoomDev/export-miro-flowcharts/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: diagram
    attributes:
      label: The diagram
      description: Describe it, or attach a screenshot. Shapes, connectors with or without arrows, frames, loose texts.
  - type: textarea
    id: output
    attributes:
      label: The export
      description: The output you got (redact if needed).
      render: text
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 131 on Windows 11
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Right-click inside the panel → Inspect → Console. Paste any errors.
      render: text
