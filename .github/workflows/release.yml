name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Tag must match the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(bun -e "console.log(require('./manifest.json').version)")"
          if [ "$tag" != "$manifest" ]; then
            echo "Tag v$tag does not match manifest version $manifest" >&2
            exit 1
          fi

      - run: bun run test
      - run: bun run typecheck
      - run: bunx playwright-core install --with-deps chromium
      - run: bun run smoke
      - run: bun run zip

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/export-miro-flowcharts.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
